<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090f"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b87333;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#b87333;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Ambient copper glow -->
  <ellipse cx="600" cy="200" rx="500" ry="300" fill="#b87333" opacity="0.06" filter="url(#blur)"/>
  <!-- Border -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#1e1e30" stroke-width="1.5"/>
  <!-- Decorative line top -->
  <rect x="540" y="30" width="120" height="3" rx="2" fill="#b87333" opacity="0.6"/>
  <!-- Text content -->
  <text x="600" y="255" font-family="Georgia, serif" font-size="80" font-weight="700" fill="#e0e0f0" text-anchor="middle" letter-spacing="-2">
    VNS<tspan fill="#d4956a">Vault</tspan>
  </text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="22" fill="#5a5a7a" text-anchor="middle" letter-spacing="8">
    VISUAL NOVEL HUB
  </text>
  <!-- Divider -->
  <rect x="520" y="340" width="160" height="1" fill="#1e1e30"/>
  <!-- Tagline -->
  <text x="600" y="385" font-family="Arial, sans-serif" font-size="18" fill="#9090b0" text-anchor="middle">
    Kho tàng Visual Novel &amp; game truyện tranh Việt hóa
  </text>
  <!-- Tags -->
  <rect x="330" y="420" width="160" height="32" rx="16" fill="#1e1e30" stroke="#1e1e30"/>
  <text x="410" y="441" font-family="Arial, sans-serif" font-size="13" fill="#5a5a7a" text-anchor="middle">100% Miễn Phí</text>
  <rect x="510" y="420" width="180" height="32" rx="16" fill="#1e1e30" stroke="#1e1e30"/>
  <text x="600" y="441" font-family="Arial, sans-serif" font-size="13" fill="#5a5a7a" text-anchor="middle">Không Quảng Cáo</text>
  <rect x="710" y="420" width="160" height="32" rx="16" fill="#1e1e30" stroke="#1e1e30"/>
  <text x="790" y="441" font-family="Arial, sans-serif" font-size="13" fill="#5a5a7a" text-anchor="middle">Chất Lượng Cao</text>
  <!-- URL -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="16" fill="#3a3a55" text-anchor="middle">vnsvault.vercel.app</text>
</svg>
